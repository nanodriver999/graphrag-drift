[project]
name = "graphrag-drift"
version = "0.2.0"
description = "LangGraph implementation of Local, Global, and DRIFT-style GraphRAG search orchestration"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "neo4j>=5.28,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
