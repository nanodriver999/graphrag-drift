name: Live OpenCode Muse Spark smoke

on:
  pull_request:
    paths:
      - ".github/workflows/live-opencode-muse-smoke.yml"
      - "scripts/opencode_openai_shim.py"
      - "opencode_muse_gateway/**"
      - "src/graphrag_drift/openai_compatible.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-muse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Download pinned OpenCode CLI
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.18.34"
          curl -fL --retry 3             "https://github.com/anomalyco/opencode/releases/download/v${VERSION}/opencode-linux-x64.tar.gz"             -o opencode.tar.gz
          echo "0f22479647226d1d2dd99595d20082ee7bda3870b62dc6a90b41efc1a71d7e9a  opencode.tar.gz" | sha256sum -c -
          tar -xzf opencode.tar.gz
          chmod +x opencode
          ./opencode --version

      - name: Start OpenCode HTTP server
        shell: bash
        run: |
          set -euo pipefail
          nohup ./opencode serve             --hostname 127.0.0.1             --port 4096             > "$RUNNER_TEMP/opencode.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/opencode.pid"

          for i in $(seq 1 30); do
            if curl --max-time 2 -fsS http://127.0.0.1:4096/global/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/opencode.log"
          exit 1

      - name: Select workload-capable free model with Muse preferred
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select_opencode_free_model.py \
            --opencode-url http://127.0.0.1:4096 \
            --preferred-model muse-spark-1.3-contributor-free \
            --max-models 3 \
            --timeout 60 \
            --output "$RUNNER_TEMP/opencode-model-selection.json" \
            --github-env "$GITHUB_ENV"
          cat "$RUNNER_TEMP/opencode-model-selection.json"

      - name: Start OpenAI-compatible shim
        shell: bash
        env:
          OPENCODE_URL: http://127.0.0.1:4096
          OPENCODE_REQUEST_TIMEOUT: "120"
        run: |
          set -euo pipefail
          nohup python opencode_muse_gateway/gateway.py             --host 127.0.0.1             --port 8000             > "$RUNNER_TEMP/opencode-shim.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/opencode-shim.pid"

          for i in $(seq 1 30); do
            if curl --max-time 2 -fsS http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/opencode-shim.log"
          exit 1

      - name: Call selected model through project OpenAI-compatible client
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from graphrag_drift import OpenAICompatibleTextGenerator

          import os

          fallbacks = tuple(
              item.strip()
              for item in os.getenv("OPENAI_COMPATIBLE_MODEL_FALLBACKS", "").split(",")
              if item.strip()
          )
          generator = OpenAICompatibleTextGenerator(
              base_url="http://127.0.0.1:8000",
              model=os.environ["OPENAI_COMPATIBLE_MODEL"],
              fallback_models=fallbacks,
              timeout_seconds=105,
              temperature=0,
              max_retries=1,
              retry_backoff_seconds=0,
          )

          answer = generator.generate(
              "Reply with exactly OPENCODE_WORKLOAD_FALLBACK_OK and nothing else."
          )
          print("Selected model response:", answer)
          assert "OPENCODE_WORKLOAD_FALLBACK_OK" in answer, answer
          PY

      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          echo "--- opencode.log ---"
          cat "$RUNNER_TEMP/opencode.log" 2>/dev/null || true
          echo "--- opencode-shim.log ---"
          cat "$RUNNER_TEMP/opencode-shim.log" 2>/dev/null || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/opencode-shim.pid" || kill "$(cat "$RUNNER_TEMP/opencode-shim.pid")" >/dev/null 2>&1 || true
          test ! -f "$RUNNER_TEMP/opencode.pid" || kill "$(cat "$RUNNER_TEMP/opencode.pid")" >/dev/null 2>&1 || true
