name: Live OpenCode Muse Spark smoke

on:
  pull_request:
    paths:
      - ".github/workflows/live-opencode-muse-smoke.yml"
      - "scripts/opencode_openai_shim.py"
      - "opencode_muse_gateway/**"
      - "src/graphrag_drift/openai_compatible.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-muse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Download pinned OpenCode CLI
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.18.34"
          curl -fL --retry 3             "https://github.com/anomalyco/opencode/releases/download/v${VERSION}/opencode-linux-x64.tar.gz"             -o opencode.tar.gz
          echo "0f22479647226d1d2dd99595d20082ee7bda3870b62dc6a90b41efc1a71d7e9a  opencode.tar.gz" | sha256sum -c -
          tar -xzf opencode.tar.gz
          chmod +x opencode
          ./opencode --version

      - name: Start OpenCode HTTP server
        shell: bash
        run: |
          set -euo pipefail
          nohup ./opencode serve             --hostname 127.0.0.1             --port 4096             > "$RUNNER_TEMP/opencode.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/opencode.pid"

          for i in $(seq 1 30); do
            if curl --max-time 2 -fsS http://127.0.0.1:4096/global/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/opencode.log"
          exit 1

      - name: Verify free Muse model is exposed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:4096/provider", timeout=10) as response:
              payload = json.load(response)

          provider = next(item for item in payload["all"] if item["id"] == "opencode")
          model = provider["models"]["muse-spark-1.3-contributor-free"]

          assert "opencode" in payload["connected"], payload["connected"]
          assert model["cost"]["input"] == 0, model["cost"]
          assert model["cost"]["output"] == 0, model["cost"]
          print("Muse free model exposed:", model["name"])
          PY

      - name: Start OpenAI-compatible shim
        shell: bash
        env:
          OPENCODE_URL: http://127.0.0.1:4096
          OPENCODE_PROVIDER_ID: opencode
          OPENCODE_MODEL_ID: muse-spark-1.3-contributor-free
          OPENCODE_REQUEST_TIMEOUT: "180"
        run: |
          set -euo pipefail
          nohup python opencode_muse_gateway/gateway.py             --host 127.0.0.1             --port 8000             > "$RUNNER_TEMP/opencode-shim.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/opencode-shim.pid"

          for i in $(seq 1 30); do
            if curl --max-time 2 -fsS http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/opencode-shim.log"
          exit 1

      - name: Call Muse through project OpenAI-compatible client
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from graphrag_drift import OpenAICompatibleTextGenerator

          generator = OpenAICompatibleTextGenerator(
              base_url="http://127.0.0.1:8000",
              model="muse-spark-1.3-contributor-free",
              timeout_seconds=180,
              temperature=0,
          )

          answer = generator.generate(
              "Reply with exactly MUSE_SPARK_LIVE_OK and nothing else."
          )
          print("Muse response:", answer)
          assert "MUSE_SPARK_LIVE_OK" in answer, answer
          PY

      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          echo "--- opencode.log ---"
          cat "$RUNNER_TEMP/opencode.log" 2>/dev/null || true
          echo "--- opencode-shim.log ---"
          cat "$RUNNER_TEMP/opencode-shim.log" 2>/dev/null || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/opencode-shim.pid" || kill "$(cat "$RUNNER_TEMP/opencode-shim.pid")" >/dev/null 2>&1 || true
          test ! -f "$RUNNER_TEMP/opencode.pid" || kill "$(cat "$RUNNER_TEMP/opencode.pid")" >/dev/null 2>&1 || true
