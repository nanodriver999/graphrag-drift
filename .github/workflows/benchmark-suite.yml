name: Run GraphRAG benchmark suite

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Benchmark JSONL path"
        required: true
        default: "benchmarks/legal_smoke.jsonl"
        type: string
      local_community_prop:
        description: "Local Search Community Report proportion"
        required: true
        default: "0.25"
        type: string
      local_text_unit_prop:
        description: "Local Search Chunk/text-unit proportion"
        required: true
        default: "0.50"
        type: string
      as_of_date:
        description: "Legal retrieval date (YYYY-MM-DD)"
        required: true
        default: "2026-10-05"
        type: string
      drift_max_depth:
        description: "Maximum ranked DRIFT epochs"
        required: true
        default: "2"
        type: string
      drift_max_actions_per_depth:
        description: "Maximum DRIFT actions selected per epoch"
        required: true
        default: "2"
        type: string
      drift_community_top_k:
        description: "Community Reports mixed into each follow-up action"
        required: true
        default: "1"
        type: string
      drift_action_concurrency:
        description: "Maximum concurrent DRIFT follow-up actions"
        required: true
        default: "4"
        type: string
      drift_primer_folds:
        description: "Number of DRIFT primer folds"
        required: true
        default: "5"
        type: string
      drift_primer_concurrency:
        description: "Maximum concurrent DRIFT primer folds"
        required: true
        default: "5"
        type: string
      baseline_path:
        description: "Optional benchmark baseline JSON path in the repository"
        required: false
        default: ""
        type: string
      fail_on_regression:
        description: "Fail when configured regression thresholds are exceeded"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEO4J_AURA_BLOB: ${{ secrets.NEO4J_AURA }}
      GRAPHRAG_AS_OF_DATE: ${{ inputs.as_of_date }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Load Aura credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEO4J_AURA_BLOB:-}" ]; then
            echo "NEO4J_AURA secret is not available."
            echo "## Benchmark skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Aura credentials are not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          secret_file="$RUNNER_TEMP/neo4j_aura.env"
          printf '%s\n' "$NEO4J_AURA_BLOB" > "$secret_file"
          chmod 600 "$secret_file"
          set -a
          source "$secret_file"
          set +a
          : "${NEO4J_URI:?NEO4J_URI missing}"
          : "${NEO4J_USERNAME:?NEO4J_USERNAME missing}"
          : "${NEO4J_PASSWORD:?NEO4J_PASSWORD missing}"
          echo "NEO4J_URI=$NEO4J_URI" >> "$GITHUB_ENV"
          echo "NEO4J_USERNAME=$NEO4J_USERNAME" >> "$GITHUB_ENV"
          echo "NEO4J_PASSWORD=$NEO4J_PASSWORD" >> "$GITHUB_ENV"
          echo "NEO4J_DATABASE=${NEO4J_DATABASE:-}" >> "$GITHUB_ENV"
          unset NEO4J_AURA_BLOB
          rm -f "$secret_file"

      - name: Check Aura availability
        id: aura
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEO4J_URI:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import os
          import socket
          import urllib.parse

          host = urllib.parse.urlparse(os.environ["NEO4J_URI"]).hostname
          try:
              socket.getaddrinfo(host, 7687)
          except OSError as exc:
              print(f"Aura DNS unavailable: {host}: {exc}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("available=false\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("available=true\n")
          PY

      - name: Explain skipped benchmark
        if: steps.aura.outputs.available != 'true'
        shell: bash
        run: |
          echo "## GraphRAG benchmark skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Neo4j Aura is currently unavailable from the GitHub runner." >> "$GITHUB_STEP_SUMMARY"

      - name: Build retrieval indexes
        if: steps.aura.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python scripts/setup_vector_index.py; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Download pinned OpenCode CLI
        if: steps.aura.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.18.34"
          curl -fL --retry 3             "https://github.com/anomalyco/opencode/releases/download/v${VERSION}/opencode-linux-x64.tar.gz"             -o opencode.tar.gz
          echo "0f22479647226d1d2dd99595d20082ee7bda3870b62dc6a90b41efc1a71d7e9a  opencode.tar.gz" | sha256sum -c -
          tar -xzf opencode.tar.gz
          chmod +x opencode

      - name: Start OpenCode server
        if: steps.aura.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./opencode serve --hostname 127.0.0.1 --port 4096             </dev/null > "$RUNNER_TEMP/opencode.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/opencode.pid"

          for i in $(seq 1 60); do
            if curl --connect-timeout 1 --max-time 2 -fsS               http://127.0.0.1:4096/global/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/opencode.log" || true
          exit 1

      - name: Start OpenAI-compatible shim
        if: steps.aura.outputs.available == 'true'
        env:
          OPENCODE_URL: http://127.0.0.1:4096
          OPENCODE_PROVIDER_ID: opencode
          OPENCODE_MODEL_ID: muse-spark-1.3-contributor-free
          OPENCODE_REQUEST_TIMEOUT: "180"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/opencode_openai_shim.py             --host 127.0.0.1             --port 8000             > "$RUNNER_TEMP/opencode-shim.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/opencode-shim.pid"

          for i in $(seq 1 30); do
            if curl --connect-timeout 1 --max-time 2 -fsS               http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/opencode-shim.log" || true
          exit 1

      - name: Run benchmark suite
        if: steps.aura.outputs.available == 'true'
        env:
          OPENAI_COMPATIBLE_BASE_URL: http://127.0.0.1:8000
          OPENAI_COMPATIBLE_MODEL: muse-spark-1.3-contributor-free
          OPENAI_COMPATIBLE_TIMEOUT_SECONDS: "180"
          OPENAI_COMPATIBLE_TEMPERATURE: "0"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_benchmark_suite.py \
            --cases "${{ inputs.cases }}" \
            --local-community-prop "${{ inputs.local_community_prop }}" \
            --local-text-unit-prop "${{ inputs.local_text_unit_prop }}" \
            --drift-max-depth "${{ inputs.drift_max_depth }}" \
            --drift-max-actions-per-depth "${{ inputs.drift_max_actions_per_depth }}" \
            --drift-community-top-k "${{ inputs.drift_community_top_k }}" \
            --drift-action-concurrency "${{ inputs.drift_action_concurrency }}" \
            --drift-primer-folds "${{ inputs.drift_primer_folds }}" \
            --drift-primer-concurrency "${{ inputs.drift_primer_concurrency }}" \
            --output "$RUNNER_TEMP/graphrag-benchmark.json"

          python scripts/render_benchmark_report.py             "$RUNNER_TEMP/graphrag-benchmark.json"             --output "$RUNNER_TEMP/graphrag-benchmark.md"

          cat "$RUNNER_TEMP/graphrag-benchmark.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Compare benchmark with baseline
        if: steps.aura.outputs.available == 'true' && inputs.baseline_path != ''
        shell: bash
        run: |
          set -euo pipefail
          baseline="${{ inputs.baseline_path }}"
          if [ ! -f "$baseline" ]; then
            echo "Baseline file does not exist: $baseline" >&2
            exit 1
          fi

          args=(
            "$baseline"
            "$RUNNER_TEMP/graphrag-benchmark.json"
            --output "$RUNNER_TEMP/graphrag-regression.json"
          )
          if [ "${{ inputs.fail_on_regression }}" = "true" ]; then
            args+=(--fail-on-regression)
          fi

          set +e
          python scripts/compare_benchmark.py "${args[@]}"
          status=$?
          set -e

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "graphrag-regression.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n## Benchmark regression comparison\n\n")
              out.write(f"Status: **{payload['status']}**  \n")
              out.write(f"Regressions: **{payload['regression_count']}**\n\n")
              for row in payload.get("regressions", []):
                  out.write(
                      f"- {row['mode']} / {row['metric']}: "
                      f"baseline={row['baseline']}, current={row['current']}\n"
                  )
          PY

          exit "$status"

      - name: Upload benchmark artifacts
        if: steps.aura.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: graphrag-benchmark
          path: |
            ${{ runner.temp }}/graphrag-benchmark.json
            ${{ runner.temp }}/graphrag-benchmark.md
            ${{ runner.temp }}/graphrag-regression.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/opencode.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/opencode-shim.log" 2>/dev/null || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/opencode-shim.pid" || kill "$(cat "$RUNNER_TEMP/opencode-shim.pid")" >/dev/null 2>&1 || true
          test ! -f "$RUNNER_TEMP/opencode.pid" || kill "$(cat "$RUNNER_TEMP/opencode.pid")" >/dev/null 2>&1 || true
