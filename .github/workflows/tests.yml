name: tests

on:
  push:
    branches:
      - feature/langgraph-graphrag-mvp
      - feature/neo4j-aura-adapter
      - feature/vector-graphrag-retrieval
      - feature/aura-dump-to-docker
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  aura-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEO4J_AURA_BLOB: ${{ secrets.NEO4J_AURA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Connect to Aura and run GraphRAG smoke tests
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${NEO4J_AURA_BLOB:-}" ]; then
            echo "NEO4J_AURA secret is not available to this workflow."
            exit 1
          fi

          secret_file="$RUNNER_TEMP/neo4j_aura.env"
          printf '%s\n' "$NEO4J_AURA_BLOB" > "$secret_file"
          chmod 600 "$secret_file"

          set -a
          source "$secret_file"
          set +a

          : "${NEO4J_URI:?NEO4J_URI missing from NEO4J_AURA secret}"
          : "${NEO4J_USERNAME:?NEO4J_USERNAME missing from NEO4J_AURA secret}"
          : "${NEO4J_PASSWORD:?NEO4J_PASSWORD missing from NEO4J_AURA secret}"
          : "${NEO4J_DATABASE:?NEO4J_DATABASE missing from NEO4J_AURA secret}"

          unset NEO4J_AURA_BLOB
          rm -f "$secret_file"

          python scripts/bootstrap_aura.py
          python scripts/setup_vector_index.py
          python scripts/aura_smoke_test.py
          python scripts/vector_graphrag_smoke.py
          pytest -q tests/test_aura_integration.py


  aura-dump-to-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEO4J_AURA_BLOB: ${{ secrets.NEO4J_AURA }}
      LOCAL_NEO4J_URI: bolt://localhost:17687
      LOCAL_NEO4J_USERNAME: neo4j
      LOCAL_NEO4J_PASSWORD: local-test-password
      LOCAL_NEO4J_DATABASE: neo4j
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Export Aura logical dump
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEO4J_AURA_BLOB:-}" ]; then
            echo "NEO4J_AURA secret is not available."
            exit 1
          fi

          secret_file="$RUNNER_TEMP/neo4j_aura.env"
          printf '%s\n' "$NEO4J_AURA_BLOB" > "$secret_file"
          chmod 600 "$secret_file"
          set -a
          source "$secret_file"
          set +a
          unset NEO4J_AURA_BLOB
          rm -f "$secret_file"

          python scripts/export_aura_logical_dump.py "$RUNNER_TEMP/aura-graph.json"
      - name: Start plain Docker Neo4j
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name graphrag-dump-target \
            -p 17474:7474 -p 17687:7687 \
            -e NEO4J_AUTH=neo4j/local-test-password \
            neo4j:5.26-community

          for i in $(seq 1 60); do
            if docker exec graphrag-dump-target cypher-shell \
              -u neo4j -p local-test-password "RETURN 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          docker logs graphrag-dump-target
          exit 1
      - name: Import dump into Docker Neo4j
        run: python scripts/import_logical_dump.py "$RUNNER_TEMP/aura-graph.json"
      - name: Verify imported graph
        run: python scripts/verify_logical_dump.py "$RUNNER_TEMP/aura-graph.json"
      - name: Remove transient dump
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/aura-graph.json"
          docker rm -f graphrag-dump-target >/dev/null 2>&1 || true
