name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/langgraph-graphrag-mvp
      - feature/neo4j-aura-adapter
      - feature/vector-graphrag-retrieval
      - feature/aura-dump-to-docker
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  aura-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEO4J_AURA_BLOB: ${{ secrets.NEO4J_AURA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Connect to Aura and run GraphRAG smoke tests
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${NEO4J_AURA_BLOB:-}" ]; then
            echo "NEO4J_AURA secret is not available; skipping external integration."
            exit 0
          fi

          secret_file="$RUNNER_TEMP/neo4j_aura.env"
          printf '%s\n' "$NEO4J_AURA_BLOB" > "$secret_file"
          chmod 600 "$secret_file"

          set -a
          source "$secret_file"
          set +a

          : "${NEO4J_URI:?NEO4J_URI missing from NEO4J_AURA secret}"
          : "${NEO4J_USERNAME:?NEO4J_USERNAME missing from NEO4J_AURA secret}"
          : "${NEO4J_PASSWORD:?NEO4J_PASSWORD missing from NEO4J_AURA secret}"
          : "${NEO4J_DATABASE:?NEO4J_DATABASE missing from NEO4J_AURA secret}"

          unset NEO4J_AURA_BLOB
          rm -f "$secret_file"

          python - <<'PY'
          import os, socket, urllib.parse, sys
          host = urllib.parse.urlparse(os.environ["NEO4J_URI"]).hostname
          try:
              socket.getaddrinfo(host, 7687)
          except OSError as exc:
              print(f"Aura DNS unavailable; skipping external integration: {host}: {exc}")
              sys.exit(42)
          PY
          status=$?
          if [ "$status" -eq 42 ]; then
            exit 0
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

          for cmd in             "python scripts/bootstrap_aura.py"             "python scripts/setup_vector_index.py"             "python scripts/aura_smoke_test.py"             "python scripts/vector_graphrag_smoke.py"             "pytest -q tests/test_aura_integration.py"
          do
            ok=false
            for attempt in 1 2 3; do
              if eval "$cmd"; then
                ok=true
                break
              fi
              echo "Attempt $attempt failed: $cmd"
              sleep $((attempt * 5))
            done
            [ "$ok" = true ] || exit 1
          done

