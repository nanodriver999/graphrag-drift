name: Compare DRIFT search profiles

on:
  push:
    branches: [main]
    paths:
      - "benchmark_requests/drift-profile/**"
  workflow_dispatch:
    inputs:
      cases:
        description: "Benchmark JSONL path"
        required: true
        default: "benchmarks/legal_smoke.jsonl"
        type: string
      as_of_date:
        description: "Legal retrieval date (YYYY-MM-DD)"
        required: true
        default: "2026-10-05"
        type: string
      drift_top_k:
        description: "DRIFT top-k retrieval size"
        required: true
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEO4J_AURA_BLOB: ${{ secrets.NEO4J_AURA }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve comparison request
        shell: bash
        env:
          INPUT_CASES: ${{ inputs.cases }}
          INPUT_AS_OF_DATE: ${{ inputs.as_of_date }}
          INPUT_DRIFT_TOP_K: ${{ inputs.drift_top_k }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            cases="${INPUT_CASES}"
            as_of="${INPUT_AS_OF_DATE}"
            top_k="${INPUT_DRIFT_TOP_K}"
          else
            request_file="$(find benchmark_requests/drift-profile -maxdepth 1 -type f -name '*.json' | sort | tail -n 1)"
            test -n "$request_file"
            readarray -t values < <(python - "$request_file" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          print(payload.get("cases", "benchmarks/legal_smoke.jsonl"))
          print(payload.get("as_of_date", "2026-10-05"))
          print(payload.get("drift_top_k", 2))
          PY
            )
            cases="${values[0]}"
            as_of="${values[1]}"
            top_k="${values[2]}"
          fi
          echo "CASES=$cases" >> "$GITHUB_ENV"
          echo "GRAPHRAG_AS_OF_DATE=$as_of" >> "$GITHUB_ENV"
          echo "DRIFT_TOP_K=$top_k" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Load Aura credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEO4J_AURA_BLOB:-}" ]; then
            echo "available=false" >> "$GITHUB_ENV"
            exit 0
          fi

          secret_file="$RUNNER_TEMP/neo4j_aura.env"
          printf '%s\n' "$NEO4J_AURA_BLOB" > "$secret_file"
          chmod 600 "$secret_file"
          set -a
          source "$secret_file"
          set +a
          : "${NEO4J_URI:?NEO4J_URI missing}"
          : "${NEO4J_USERNAME:?NEO4J_USERNAME missing}"
          : "${NEO4J_PASSWORD:?NEO4J_PASSWORD missing}"
          echo "NEO4J_URI=$NEO4J_URI" >> "$GITHUB_ENV"
          echo "NEO4J_USERNAME=$NEO4J_USERNAME" >> "$GITHUB_ENV"
          echo "NEO4J_PASSWORD=$NEO4J_PASSWORD" >> "$GITHUB_ENV"
          echo "NEO4J_DATABASE=${NEO4J_DATABASE:-}" >> "$GITHUB_ENV"
          unset NEO4J_AURA_BLOB
          rm -f "$secret_file"

      - name: Check Aura availability
        id: aura
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEO4J_URI:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import os
          import socket
          import urllib.parse

          host = urllib.parse.urlparse(os.environ["NEO4J_URI"]).hostname
          try:
              socket.getaddrinfo(host, 7687)
          except OSError as exc:
              print(f"Aura DNS unavailable: {host}: {exc}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("available=false\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("available=true\n")
          PY

      - name: Explain skipped comparison
        if: steps.aura.outputs.available != 'true'
        shell: bash
        run: |
          echo "## DRIFT profile comparison skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Neo4j Aura is unavailable from this runner." >> "$GITHUB_STEP_SUMMARY"

      - name: Build retrieval indexes
        if: steps.aura.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python scripts/setup_vector_index.py; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Download pinned OpenCode CLI
        if: steps.aura.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.18.34"
          curl -fL --retry 3 \
            "https://github.com/anomalyco/opencode/releases/download/v${VERSION}/opencode-linux-x64.tar.gz" \
            -o opencode.tar.gz
          echo "0f22479647226d1d2dd99595d20082ee7bda3870b62dc6a90b41efc1a71d7e9a  opencode.tar.gz" | sha256sum -c -
          tar -xzf opencode.tar.gz
          chmod +x opencode

      - name: Start OpenCode server
        if: steps.aura.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./opencode serve --hostname 127.0.0.1 --port 4096 \
            </dev/null > "$RUNNER_TEMP/opencode.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/opencode.pid"
          for i in $(seq 1 60); do
            if curl --connect-timeout 1 --max-time 2 -fsS \
              http://127.0.0.1:4096/global/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/opencode.log" || true
          exit 1

      - name: Start OpenAI-compatible shim
        if: steps.aura.outputs.available == 'true'
        env:
          OPENCODE_URL: http://127.0.0.1:4096
          OPENCODE_PROVIDER_ID: opencode
          OPENCODE_MODEL_ID: muse-spark-1.3-contributor-free
          OPENCODE_REQUEST_TIMEOUT: "180"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/opencode_openai_shim.py \
            --host 127.0.0.1 \
            --port 8000 \
            > "$RUNNER_TEMP/opencode-shim.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/opencode-shim.pid"
          for i in $(seq 1 30); do
            if curl --connect-timeout 1 --max-time 2 -fsS \
              http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/opencode-shim.log" || true
          exit 1

      - name: Compare economy and microsoft-like DRIFT
        if: steps.aura.outputs.available == 'true'
        env:
          OPENAI_COMPATIBLE_BASE_URL: http://127.0.0.1:8000
          OPENAI_COMPATIBLE_MODEL: muse-spark-1.3-contributor-free
          OPENAI_COMPATIBLE_TIMEOUT_SECONDS: "180"
          OPENAI_COMPATIBLE_TEMPERATURE: "0"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_drift_profile_comparison.py \
            --cases "$CASES" \
            --drift-top-k "$DRIFT_TOP_K" \
            --profiles economy microsoft-like \
            --baseline-profile economy \
            --output-json "$RUNNER_TEMP/drift-profile-comparison.json" \
            --output-markdown "$RUNNER_TEMP/drift-profile-comparison.md"

          cat "$RUNNER_TEMP/drift-profile-comparison.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison artifacts
        if: steps.aura.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drift-profile-comparison
          path: |
            ${{ runner.temp }}/drift-profile-comparison.json
            ${{ runner.temp }}/drift-profile-comparison.md
          retention-days: 14

      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/opencode.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/opencode-shim.log" 2>/dev/null || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/opencode-shim.pid" || kill "$(cat "$RUNNER_TEMP/opencode-shim.pid")" >/dev/null 2>&1 || true
          test ! -f "$RUNNER_TEMP/opencode.pid" || kill "$(cat "$RUNNER_TEMP/opencode.pid")" >/dev/null 2>&1 || true
