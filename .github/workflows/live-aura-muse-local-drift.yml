name: Live Aura Muse Local DRIFT smoke

on:
  pull_request:
    paths:
      - "src/graphrag_drift/search_llm_reasoner.py"
      - "src/graphrag_drift/neo4j_graphrag_retrieval.py"
      - "src/graphrag_drift/query_expansion.py"
      - "scripts/setup_vector_index.py"
      - "scripts/run_llm_aura_search.py"
      - ".github/workflows/live-aura-muse-local-drift.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-aura-muse-local-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEO4J_AURA_BLOB: ${{ secrets.NEO4J_AURA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Load Aura credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEO4J_AURA_BLOB:-}" ]; then
            echo "NEO4J_AURA secret is not available."
            exit 1
          fi
          secret_file="$RUNNER_TEMP/neo4j_aura.env"
          printf '%s\n' "$NEO4J_AURA_BLOB" > "$secret_file"
          chmod 600 "$secret_file"
          set -a
          source "$secret_file"
          set +a
          : "${NEO4J_URI:?NEO4J_URI missing}"
          : "${NEO4J_USERNAME:?NEO4J_USERNAME missing}"
          : "${NEO4J_PASSWORD:?NEO4J_PASSWORD missing}"
          echo "NEO4J_URI=$NEO4J_URI" >> "$GITHUB_ENV"
          echo "NEO4J_USERNAME=$NEO4J_USERNAME" >> "$GITHUB_ENV"
          echo "NEO4J_PASSWORD=$NEO4J_PASSWORD" >> "$GITHUB_ENV"
          echo "NEO4J_DATABASE=${NEO4J_DATABASE:-}" >> "$GITHUB_ENV"
          unset NEO4J_AURA_BLOB
          rm -f "$secret_file"

      - name: Build Entity and Chunk retrieval indexes
        run: python scripts/setup_vector_index.py

      - name: Download pinned OpenCode CLI
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.18.34"
          curl -fL --retry 3             "https://github.com/anomalyco/opencode/releases/download/v${VERSION}/opencode-linux-x64.tar.gz"             -o opencode.tar.gz
          echo "0f22479647226d1d2dd99595d20082ee7bda3870b62dc6a90b41efc1a71d7e9a  opencode.tar.gz" | sha256sum -c -
          tar -xzf opencode.tar.gz
          chmod +x opencode
          ./opencode --version

      - name: Start OpenCode server
        shell: bash
        run: |
          set -euo pipefail
          ./opencode serve --hostname 127.0.0.1 --port 4096 </dev/null > "$RUNNER_TEMP/opencode.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/opencode.pid"
          for i in $(seq 1 60); do
            if curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:4096/global/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/opencode.log" || true
          exit 1

      - name: Start OpenAI-compatible shim
        env:
          OPENCODE_URL: http://127.0.0.1:4096
          OPENCODE_PROVIDER_ID: opencode
          OPENCODE_MODEL_ID: muse-spark-1.3-contributor-free
          OPENCODE_REQUEST_TIMEOUT: "180"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/opencode_openai_shim.py --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/opencode-shim.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/opencode-shim.pid"
          for i in $(seq 1 30); do
            if curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/opencode-shim.log" || true
          exit 1

      - name: Run Local Search with Aura and Muse
        env:
          OPENAI_COMPATIBLE_BASE_URL: http://127.0.0.1:8000
          OPENAI_COMPATIBLE_MODEL: muse-spark-1.3-contributor-free
          OPENAI_COMPATIBLE_TIMEOUT_SECONDS: "180"
          OPENAI_COMPATIBLE_TEMPERATURE: "0"
        shell: bash
        run: |
          python scripts/run_llm_aura_search.py local             "방사선안전관리자의 주요 의무는 무엇인가?"             --top-k 4 > "$RUNNER_TEMP/local.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "local.json").read_text(encoding="utf-8"))
          assert result["evidence"], result
          assert result["answer"].strip(), result
          assert any(item["id"].startswith("chunk") for item in result["evidence"]), result["evidence"]
          assert len(result.get("retrieval_queries", [])) >= 2, result
          print("Local retrieval queries:", result["retrieval_queries"])
          print("Local evidence IDs:", [item["id"] for item in result["evidence"]])
          print("Local answer:", result["answer"])
          PY

      - name: Run DRIFT Search with Aura and Muse
        env:
          OPENAI_COMPATIBLE_BASE_URL: http://127.0.0.1:8000
          OPENAI_COMPATIBLE_MODEL: muse-spark-1.3-contributor-free
          OPENAI_COMPATIBLE_TIMEOUT_SECONDS: "180"
          OPENAI_COMPATIBLE_TEMPERATURE: "0"
        shell: bash
        run: |
          python scripts/run_llm_aura_search.py drift             "업무대행자와 방사선안전관리자의 관계와 주요 의무를 설명해줘."             --top-k 2             --max-depth 1 > "$RUNNER_TEMP/drift.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "drift.json").read_text(encoding="utf-8"))
          assert result["evidence"], result
          assert result["answer"].strip(), result
          assert any(item["id"].startswith("chunk:") for item in result["evidence"]), result["evidence"]
          print("DRIFT depth:", result["depth"])
          print("DRIFT evidence IDs:", [item["id"] for item in result["evidence"]])
          print("DRIFT answer:", result["answer"])
          PY

      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          echo "--- opencode.log ---"
          cat "$RUNNER_TEMP/opencode.log" 2>/dev/null || true
          echo "--- shim log ---"
          cat "$RUNNER_TEMP/opencode-shim.log" 2>/dev/null || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/opencode-shim.pid" || kill "$(cat "$RUNNER_TEMP/opencode-shim.pid")" >/dev/null 2>&1 || true
          test ! -f "$RUNNER_TEMP/opencode.pid" || kill "$(cat "$RUNNER_TEMP/opencode.pid")" >/dev/null 2>&1 || true
